# Per-platform CI for jhonstart.
#
# jhonstart renders to a string, so it runs on `commonJS` and on `erlang`.
# Bootstrap: check out this lib + botopink-lang, place this lib under
# `botopink-lang/repository/jhonstart/`, run `zig build test-libs -- --lib
# jhonstart --target <matrix.target>`.
#
# `repository/jhonstart/` is a workspace (decision 75): the `repository/` root
# contributes its members by manifest name, so `--lib jhonstart` selects the
# member `modules/jhonstart/` and the umbrella has no row. The example members
# (`jhonstart-counter`, `jhonstart-html`, `jhonstart-todo`) are rows of their
# own; the Examples build step below still builds each one from its manifest.
name: test

on:
  push:
    branches: [feat, master, main]
  pull_request:
    branches: [feat, master, main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  LIB_NAME: jhonstart
  BOTOPINK_LANG_REPO: botopink/botopink-lang

jobs:
  test:
    name: ${{ matrix.runner }} · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # The `erlang` axis is a hard cell: `botopink test --target erlang`
        # passes the core member's whole suite (9/9, measured 2026-09-21 in
        # modules/jhonstart/). windows-2022
        # commonJS now runs the source step under `shell: bash` (ci-tail W1),
        # so the PowerShell `${LIB_NAME}` expansion gap is closed and the row
        # carries `allow_fail: false`.
        include:
          - { runner: ubuntu-22.04, target: commonJS, allow_fail: false }
          - { runner: ubuntu-22.04, target: erlang,   allow_fail: false }
          - { runner: macos-14,     target: commonJS, allow_fail: false }
          - { runner: macos-14,     target: erlang,   allow_fail: false }
          - { runner: windows-2022, target: commonJS, allow_fail: false }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow_fail }}
    steps:
      - name: Checkout this lib
        uses: actions/checkout@v5
        with:
          path: self

      - name: Checkout botopink-lang
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOTOPINK_LANG_REPO }}
          ref: ${{ vars.BOTOPINK_LANG_REF || 'feat' }}
          path: botopink-lang

      - name: Place lib under botopink-lang/repository/${{ env.LIB_NAME }}/
        shell: bash
        run: |
          mkdir -p botopink-lang/repository
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --delete self/ "botopink-lang/repository/${LIB_NAME}/"
          else
            rm -rf "botopink-lang/repository/${LIB_NAME}"
            cp -R self "botopink-lang/repository/${LIB_NAME}"
          fi

      - name: Install erlang (linux)
        if: matrix.runner == 'ubuntu-22.04' && matrix.target == 'erlang'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y erlang

      - name: Install erlang (macos)
        if: matrix.runner == 'macos-14' && matrix.target == 'erlang'
        run: brew install erlang

      - name: Install Node 20 (for commonJS target)
        if: matrix.target == 'commonJS'
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # H7 (v0.beta.19) — release fast path. Opt-in via the lib's
      # `BOTOPINK_USE_RELEASE_FASTPATH` repo variable. Set to `true` after
      # botopink-lang has published at least one tagged release; until then,
      # the source path below is the default.
      - name: Install botopink (release fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        shell: bash
        run: |
          if [ "${{ matrix.runner }}" = "windows-2022" ]; then
            powershell -ExecutionPolicy Bypass -Command "iwr https://botopink.dev/install.ps1 -UseBasicParsing | iex"
            echo "$USERPROFILE\\.bpmp\\bin" >> $GITHUB_PATH
          else
            curl --proto '=https' --tlsv1.2 -sSfL https://botopink.dev/install.sh | sh
            echo "$HOME/.bpmp/bin" >> $GITHUB_PATH
          fi

      - name: Install Zig (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig build install (source build path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        run: zig build install

      - name: zig build test-libs --lib jhonstart --target ${{ matrix.target }} (source)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH != 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: zig build test-libs -- --lib "${LIB_NAME}" --target "${{ matrix.target }}"

      - name: botopink-lib-test --lib jhonstart --target ${{ matrix.target }} (fast path)
        if: ${{ vars.BOTOPINK_USE_RELEASE_FASTPATH == 'true' }}
        working-directory: botopink-lang
        shell: bash
        run: botopink-lib-test --lib "${LIB_NAME}" --target "${{ matrix.target }}"

      # Every examples/*/ with a botopink.json builds (runExamplesGate, the same
      # stage as the pre-commit hook); scripts/known-broken-examples.txt lists
      # the ones allowed to fail. Each example uses its own manifest target, so
      # this runs once, not per target.
      - name: Examples build
        if: matrix.target == 'commonJS'
        working-directory: botopink-lang/repository/${{ env.LIB_NAME }}
        shell: bash
        run: |
          source scripts/git-hooks/lib/runner-standalone.sh
          bin=$(locateBotopink) || { echo "botopink binary not found"; exit 1; }
          runExamplesGate "$bin"
